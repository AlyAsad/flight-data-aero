# Render Blueprint: New > Blueprint, pick this repo. Free plan: sleeps after
# 15 min without traffic and the disk is wiped on restart (the cache refills).
services:
  - type: web
    name: aero
    runtime: docker
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: PROVIDER_MODE
        value: fast_flights
      - key: ADMIN_PASSWORD
        sync: false # set in the Render dashboard
      - key: SERPAPI_API_KEY
        sync: false # optional; set in the Render dashboard
